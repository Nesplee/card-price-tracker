services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - card_tracker_pg_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # mem_limit (2026-11-15) : pic 4495 Mio (cgroup memory.peak depuis le 14/11 14:36), 433 Mio au repos.
    # Le pic est surtout du cache de pages, récupérable : 3g borne la base sans risque d OOM.
    # Après l OOM global du 13/11.
    mem_limit: 3g
    restart: unless-stopped

  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # airflow-init : conteneur "a usage unique" (voir docker-compose.yml local
  # pour le detail complet) -- pas de healthcheck ici, une verification de
  # sante n'a de sens que pour un service cense rester UP en continu.
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
    entrypoint: /bin/bash
    # IMPORTANT -- les lignes de continuation ci-dessous DOIVENT rester a LA
    # MEME indentation (6 espaces) que la premiere ("-c ..."). En YAML, un
    # scalaire replie (">") ne fusionne les retours a la ligne en espaces QUE
    # si l'indentation est constante -- une ligne plus indentee est traitee
    # litteralement, retour a la ligne inclus. C'est exactement le bug deja
    # rencontre et corrige sur le docker-compose.yml local (Mois 2) :
    # une sur-indentation ici avait casse la commande en plusieurs
    # instructions bash distinctes ("airflow users create" sans ses
    # arguments -e/-f/-l/-r, puis "--firstname ..." execute comme une
    # commande inconnue). Reproduit puis corrige ici, meme cause, meme fix.
    command: >
      -c "airflow db migrate &&
      airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD}
      --firstname Admin --lastname User --role Admin --email admin@example.com"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./.env:/opt/airflow/.env:ro

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      # TLS via certificat Tailscale (voir
      # docs/superpowers/specs/2026-08-14-tailscale-remote-access-design.md) :
      # gunicorn (webserver Airflow) consomme le PEM directement, comme
      # uvicorn pour dashboard-api -- pas de conversion keystore nécessaire.
      AIRFLOW__WEBSERVER__WEB_SERVER_SSL_CERT: /certs/cert.pem
      AIRFLOW__WEBSERVER__WEB_SERVER_SSL_KEY: /certs/key.pem
      # interface consultée rarement (aucune visite sur 7 jours au 2026-11-14) :
      # 1 worker gunicorn au lieu de 4, environ 300 Mo de RAM en moins
      AIRFLOW__WEBSERVER__WORKERS: "1"
    command: webserver
    # ${TAILSCALE_IP:-127.0.0.1} : voir commentaire équivalent sur
    # dashboard-api. Jamais exposé sur l'interface publique.
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs
      - ./.env:/opt/airflow/.env:ro
      - ./tailscale-certs:/certs:ro
    healthcheck:
      # -k : voir commentaire équivalent sur dashboard-api (nom "localhost"
      # vs nom du certificat). gunicorn (comme uvicorn) n'impose pas de
      # correspondance stricte SNI/certificat côté serveur.
      test: ["CMD", "curl", "--fail", "-k", "https://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # mem_limit (2026-11-15) : pic 866 Mio (memory.peak depuis le 14/11), 258 Mio au repos (1 worker gunicorn).
    # 1280m = ~1,5x le pic ; le swap (4 Go) reste le filet.
    mem_limit: 1280m
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      # LLM local qui classe les news (DAG card_market_news) : l'Ollama de
      # second_brain, sur le réseau ollama-shared ci-dessous.
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:4b
    command: scheduler
    # LocalExecutor : les tâches tournent dans CE conteneur, c'est donc lui
    # qui doit joindre Ollama. ollama-shared ne contient que second_brain-ollama
    # et ce scheduler : pas de second alias "db", "db" reste la base de ce
    # projet. (Un conteneur rattaché à deux réseaux où l'alias "db" existe des
    # deux côtés résout cet alias de façon ambiguë : incident déjà vécu avec
    # l'ancien service metabase sur le réseau annonces-metabase-shared.)
    networks:
      - default
      - ollama-shared
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs
      - ./.env:/opt/airflow/.env:ro
    # Pas de --hostname sur ce check (contrairement a un premier essai) : ce
    # filtre comparait le hostname du conteneur au hostname enregistre par
    # Airflow en base pour ce job, et les deux ne correspondaient pas
    # (constate en prod : "No alive jobs found" alors que le scheduler
    # tournait parfaitement -- 2 pipelines complets reussis pendant que ce
    # healthcheck le signalait a tort comme "unhealthy"). Un seul conteneur
    # scheduler existe dans ce deploiement, donc verifier "au moins un
    # SchedulerJob actif" (sans filtrer par hostname) est suffisant et fiable.
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # mem_limit (2026-11-15) : pic 1193 Mio (memory.peak depuis le 14/11), 431 Mio au repos.
    # LocalExecutor : les tâches tournent ici. 2g = ~1,7x le pic ; le swap (4 Go) reste le filet.
    mem_limit: 2g
    restart: unless-stopped

  # dashboard-api : API FastAPI en lecture seule pour le dashboard sur mesure
  # (voir docs/superpowers/specs/2026-08-13-custom-dashboard-design.md).
  # Se connecte via dashboard_reader (migration 007), jamais pipeline_app.
  #
  # TLS via certificat Tailscale (voir
  # docs/superpowers/specs/2026-08-14-tailscale-remote-access-design.md) :
  # uvicorn consomme le PEM Tailscale directement, pas de conversion
  # nécessaire.
  dashboard-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # POSTGRES_DB / DASHBOARD_READER_PASSWORD : injectees directement par
      # Compose (interpolation ${VAR} depuis le .env de l'hote, cote hote
      # uniquement) plutot que de monter le fichier .env entier dans le
      # conteneur. dashboard-api n'a besoin QUE de ces 4 variables (voir
      # load_dashboard_reader_config() dans src/common/config.py) -- monter
      # tout .env lui donnerait aussi acces au mot de passe superuser
      # Postgres, a la cle API PokemonTCG et aux secrets Airflow, alors que
      # ce conteneur est le seul du stack a parser des query strings fournies
      # par un utilisateur.
      POSTGRES_DB: ${POSTGRES_DB}
      DASHBOARD_READER_PASSWORD: ${DASHBOARD_READER_PASSWORD}
    volumes:
      - ./src:/app/src
      - ./tailscale-certs:/certs:ro
    # ${TAILSCALE_IP:-127.0.0.1} : IP Tailscale du VPS en prod, 127.0.0.1 en
    # local/dev (défaut si TAILSCALE_IP n'est pas défini). Jamais exposé sur
    # l'interface publique -- seule l'adresse d'écoute contrôle l'accès (ufw
    # ne gouverne pas les ports publiés par Docker).
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:8000:8000"
    healthcheck:
      # Vérification du certificat désactivée (équivalent de curl -k) : le
      # certificat est émis pour le nom Tailscale du VPS, pas pour
      # "localhost". La vérification réelle se fait côté client
      # (navigateur/mobile) via le vrai nom Tailscale.
      test: ["CMD", "python3", "-c", "import ssl, urllib.request; ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE; urllib.request.urlopen('https://localhost:8000/api/health', context=ctx)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # dashboard-frontend : le board (board/public/index.html, page statique)
  # servi par Nginx, qui proxifie /api/ vers dashboard-api (voir
  # board/nginx.conf.template). Port externe 5173, port interne 443.
  #
  # TLS via certificat Tailscale (voir
  # docs/superpowers/specs/2026-08-14-tailscale-remote-access-design.md) :
  # nginx consomme le PEM Tailscale directement.
  dashboard-frontend:
    build:
      context: ./board
      dockerfile: Dockerfile
    depends_on:
      - dashboard-api
    environment:
      # Lu par le template nginx (board/nginx.conf.template) via envsubst,
      # exécuté par l'entrypoint officiel de l'image nginx:alpine au
      # démarrage du conteneur.
      TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME}
    volumes:
      - ./tailscale-certs:/certs:ro
      # Page montée en lecture seule : une modification de board/public est
      # servie aussitôt, sans reconstruire l'image. Piège : un changement de
      # branche git qui supprime puis recrée board/public laisse le conteneur
      # sur l'ancien dossier (erreur 500) : redémarrer dashboard-frontend.
      - ./board/public:/usr/share/nginx/html:ro
    # Mapping asymétrique : port externe 5173 (inchangé), port interne 443
    # (nginx écoute désormais en HTTPS, voir Task 3).
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:5173:443"
    restart: unless-stopped

volumes:
  card_tracker_pg_data:
  airflow_pg_data:

networks:
  # Créé une fois à la main (docker network create ollama-shared), partagé
  # avec second_brain (service ollama).
  ollama-shared:
    external: true
